substitutions:
  _REGION: us-east1
  _REPOSITORY: armoriq-partner
  _BACKEND_SERVICE: armoriq-partner-backend
  _FRONTEND_SERVICE: armoriq-partner-frontend
  _TAG: latest
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, Dockerfile.backend, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_TAG}', .]
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, Dockerfile.frontend, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:${_TAG}', .]
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_TAG}']
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:${_TAG}']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:${_TAG}'
options:
  logging: CLOUD_LOGGING_ONLY
